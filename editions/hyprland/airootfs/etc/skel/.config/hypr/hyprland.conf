# Devium Hyprland - a beginner-friendly starter config.
# Press SUPER + /  (SUPER is the Windows key) to see every shortcut.
# Full docs: https://wiki.hypr.land

monitor = , preferred, auto, 1

# --- start-up ---
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store
exec-once = /usr/local/bin/devium-firstrun
exec-once = /usr/local/bin/devium-setup-wizard --first-run

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11

# --- Devium look: calm blue-grey, soft corners, light on old laptops ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(8fb4d8) rgb(b4b8e0) 45deg
    col.inactive_border = rgb(3a434e)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = false          # off by default: smoother on older laptops
    }
    shadow {
        enabled = true
        range = 14
        color = rgba(0a0c1066)
    }
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, soft, popin 85%
    animation = fade, 1, 4, soft
    animation = workspaces, 1, 4, soft, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(2b323b)
}

# --- windows that should float ---
windowrulev2 = float, class:^(org.devium.*|devium-.*)$
windowrulev2 = float, title:^(Devium.*|About Devium)$
windowrulev2 = pin, class:^(devium-spotlight)$
windowrulev2 = stayfocused, class:^(devium-spotlight)$
windowrulev2 = noborder, class:^(devium-spotlight)$
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor|calamares)$

# --- shortcuts (SUPER = Windows key) ---
$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Space, exec, devium-spotlight
bind = $mod, D, exec, fuzzel
bind = $mod, E, exec, thunar
bind = $mod, B, exec, xdg-open https://
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod, T, exec, devium-tools
bind = $mod, U, exec, devium-tools updates
bind = $mod, slash, exec, devium-keys
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied"
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot copied"
bind = $mod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, E, exit

# move focus / windows
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# drag and resize with the mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# volume, brightness, media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# your own settings go below (Devium Configure may add lines here)
