LABEL devium
TEXT HELP
Start the Devium live desktop (KDE Plasma).
You can try Devium and install it from the desktop.
ENDTEXT
MENU LABEL Devium Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash %KERNEL_PARAMS%

LABEL devium_safe
TEXT HELP
Start Devium with basic graphics. Use this if the screen stays black.
ENDTEXT
MENU LABEL Devium Live - ^safe graphics (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
