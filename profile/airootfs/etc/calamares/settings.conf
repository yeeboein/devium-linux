# Devium installer (Calamares)
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: livecleanup
    module: shellprocess
    config: shellprocess-livecleanup.conf
  - id: devium
    module: shellprocess
    config: shellprocess-devium.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@livecleanup
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - shellprocess@devium
      - umount
  - show:
      - finished

branding: devium
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
