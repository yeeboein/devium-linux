# Disk step: "Erase disk", "Install alongside" (e.g. next to Windows) or "Manual partitioning".
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        300MiB
    label:              "EFI"
userSwapChoices:
    - none
    - file
initialSwapChoice: none
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType:  "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
# Disk encryption: "Erase disk" shows an "Encrypt system" box. The disk is locked with a
# password (LUKS) - if the laptop is lost or stolen, nobody can read your files.
enableLuksAutomatedPartitioning: true
luksGeneration: luks1   # GRUB can open LUKS1 at boot (LUKS2 with argon2 it cannot)
