# Inside the new system, after users and the bootloader exist.
dontChroot: false
timeout: 900
script:
    - "pacman -U --noconfirm --needed --overwrite '*' /opt/devium-repo/devium-desktop-*.pkg.tar.zst"
    - "rm -rf /opt/devium-repo"
    - "/usr/lib/devium/devium-setup --finish"
    - "-/usr/lib/devium/patch-lockscreen"
    - "-pacman -Rns --noconfirm calamares ckbcomp archinstall mkinitcpio-archiso"
    - "rm -rf /etc/calamares"
