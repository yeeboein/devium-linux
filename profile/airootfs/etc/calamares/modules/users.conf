defaultGroups:
    - users
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - input
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true
passwordRequirements:
    nonempty: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /usr/bin/zsh
    forbidden_names: [ root, devium-live ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "devium"
    forbidden_names: [ localhost ]
