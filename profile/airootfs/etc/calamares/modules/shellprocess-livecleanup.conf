# Runs outside the new system (dontChroot) right after the copy:
# put the kernel back (archiso keeps it outside the image) and remove live-only settings.
dontChroot: true
timeout: 300
script:
    - "cp /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux ${ROOT}/boot/vmlinuz-linux"
    - "-cp /run/archiso/bootmnt/arch/boot/intel-ucode.img /run/archiso/bootmnt/arch/boot/amd-ucode.img ${ROOT}/boot/"
    - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - "rm -f ${ROOT}/etc/sddm.conf.d/20-devium-live-autologin.conf ${ROOT}/etc/lightdm/lightdm.conf.d/20-devium-live-autologin.conf ${ROOT}/etc/sudoers.d/10-devium-live ${ROOT}/etc/polkit-1/rules.d/49-devium-live.rules"
    - "rm -f ${ROOT}/etc/systemd/system/multi-user.target.wants/pacman-init.service ${ROOT}/etc/systemd/system/pacman-init.service ${ROOT}/etc/systemd/system/etc-pacman.d-gnupg.mount"
    - "rm -f ${ROOT}/etc/systemd/journald.conf.d/volatile-storage.conf ${ROOT}/etc/systemd/logind.conf.d/do-not-suspend.conf"
    - "rm -f ${ROOT}/usr/share/applications/devium-install.desktop ${ROOT}/etc/xdg/autostart/calamares.desktop"
    - "-rm -rf ${ROOT}/home/devium"
    - "cp /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/mirrorlist"
    # package signing keys: copy the live system's working keyring (an empty one makes downloads fail)
    - "rm -rf ${ROOT}/etc/pacman.d/gnupg"
    - "cp -a /etc/pacman.d/gnupg ${ROOT}/etc/pacman.d/gnupg"
    - "-rm -f ${ROOT}/etc/pacman.d/gnupg/S.*"
