name: Bug report
description: Something in Devium doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Devium! Please don't include passwords, your email or your IP address.
        Tip: run `devium-doctor --report` and attach `~/devium-doctor.txt` (IP addresses are removed).
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [KDE Plasma, Xfce, Hyprland]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Devium version
      description: The "Ver" line in `fastfetch`, e.g. Devium Beta16
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Photos or screenshots help.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: "1. Open ...\n2. Click ...\n3. ..."
  - type: dropdown
    id: blocker
    attributes:
      label: How bad is it?
      options:
        - "Small: annoying but I can keep using Devium"
        - "Big: a feature is unusable"
        - "Blocker: can't install, boot, log in or update"
