name: Hardware report
description: Tell us how Devium runs on your computer (works or not)
labels: [hardware]
body:
  - type: input
    id: model
    attributes:
      label: Computer model
      placeholder: e.g. Lenovo IdeaPad 1, Intel Celeron N4020, 4 GB RAM
    validations: { required: true }
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [KDE Plasma, Xfce, Hyprland]
    validations: { required: true }
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Installs and boots
        - label: Wi-Fi
        - label: Sound
        - label: Bluetooth
        - label: Touchpad and gestures
        - label: Brightness keys
        - label: Sleep and wake up
        - label: Webcam
        - label: External screen / HDMI
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Attach `~/devium-doctor.txt` from `devium-doctor --report` if you can.
