name: Build Devium ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build ISO in an Arch Linux container
        run: |
          sudo docker run --rm --privileged \
            -v "$PWD":/devium -w /devium \
            archlinux:latest \
            bash -c 'pacman -Syu --noconfirm --needed archiso git && git config --global --add safe.directory /devium && ./build.sh'

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: devium-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14
