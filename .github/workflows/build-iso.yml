name: Build Devium ISO

# Run by hand (Actions tab -> Run workflow) to get a test ISO as a download,
# or push a tag like v2026.12 to publish a GitHub Release ("KDE Plasma" edition).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EDITION: kdeplasma
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Pick the version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(date +%Y.%m.%d)"; fi
          echo "DEVIUM_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build ISO in an Arch Linux container
        run: |
          sudo docker run --rm --privileged \
            -e DEVIUM_VERSION -e DEVIUM_REF="${GITHUB_REF_NAME}" \
            -v "$PWD":/devium -w /devium \
            archlinux:latest \
            bash -c '
              printf "Server = %s\n" \
                "https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" \
                "https://mirrors.kernel.org/archlinux/\$repo/os/\$arch" \
                "https://mirror.rackspace.com/archlinux/\$repo/os/\$arch" \
                "https://mirror.leaseweb.net/archlinux/\$repo/os/\$arch" \
                "https://fastly.mirror.pkgbuild.com/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist &&
              pacman -Syu --noconfirm --needed archiso git &&
              git config --global --add safe.directory /devium &&
              ./build.sh'

      - name: Name the ISO and add a checksum
        run: |
          cd out
          sudo chown "$USER" ./*.iso
          iso="devium-${EDITION}-${DEVIUM_VERSION}-x86_64.iso"
          mv ./*.iso "$iso"
          sha256sum "$iso" > "$iso.sha256"
          # GitHub Releases allow at most 2 GB per file: split bigger ISOs into parts.
          if [[ $GITHUB_REF == refs/tags/v* && $(stat -c %s "$iso") -gt 2000000000 ]]; then
            split -b 1900M -d -a 3 "$iso" "$iso."
            rm "$iso"
            echo "SPLIT=1" >> "$GITHUB_ENV"
          fi
          ls -lh

      - name: Upload ISO (Actions download)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: devium-iso
          path: out/*.iso*
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Devium KDE Plasma ${{ env.DEVIUM_VERSION }}
          files: out/*
          body: |
            **Devium KDE Plasma ${{ env.DEVIUM_VERSION }}**

            Download `devium-kdeplasma-${{ env.DEVIUM_VERSION }}-x86_64.iso` and follow the
            [guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/GUIDE.md).

            If the ISO comes in parts (`.iso.000`, `.iso.001`...), download all parts and join them:
            - Linux/macOS: `cat devium-*.iso.0* > devium.iso`
            - Windows (Command Prompt): `copy /b devium-kdeplasma-${{ env.DEVIUM_VERSION }}-x86_64.iso.000+devium-kdeplasma-${{ env.DEVIUM_VERSION }}-x86_64.iso.001 devium.iso`

            Check the download with the `.sha256` file.
