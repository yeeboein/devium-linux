name: Build Devium ISO

# Run by hand (Actions tab -> Run workflow) to get a test ISO as a download,
# or push a tag like beta3 or v1.0 to publish a GitHub Release ("KDE Plasma" edition).
# Release notes come from docs/releases/<tag>.md when that file exists.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release with this name (e.g. beta4). Leave empty for a test build."
        required: false
        default: ""
      editions:
        description: "Editions to build (space separated): kdeplasma xfce"
        required: false
        default: "kdeplasma xfce"
  push:
    tags: ['v*', 'beta*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EDITIONS: ${{ github.event.inputs.editions || 'kdeplasma xfce' }}
      RELEASE: ${{ github.event.inputs.release || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Pick the version
        run: |
          if [[ -n $RELEASE ]]; then v="${RELEASE#v}"; else v="$(date +%Y.%m.%d)"; fi
          echo "DEVIUM_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build ISO in an Arch Linux container
        env:
          DEVIUM_REPORT_WEBHOOK: ${{ secrets.DEVIUM_REPORT_WEBHOOK }}
          DEVIUM_DISCORD_INVITE: ${{ vars.DEVIUM_DISCORD_INVITE }}
        run: |
          sudo docker run --rm --privileged \
            -e DEVIUM_VERSION="$DEVIUM_VERSION" -e DEVIUM_REF="${RELEASE:-$GITHUB_REF_NAME}" -e EDITIONS="$EDITIONS" \
            -e DEVIUM_REPORT_WEBHOOK="$DEVIUM_REPORT_WEBHOOK" -e DEVIUM_DISCORD_INVITE="$DEVIUM_DISCORD_INVITE" \
            -v "$PWD":/devium -w /devium \
            archlinux:latest \
            bash -c '
              printf "Server = %s\n" \
                "https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" \
                "https://mirrors.kernel.org/archlinux/\$repo/os/\$arch" \
                "https://mirror.rackspace.com/archlinux/\$repo/os/\$arch" \
                "https://mirror.leaseweb.net/archlinux/\$repo/os/\$arch" \
                "https://fastly.mirror.pkgbuild.com/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist &&
              pacman -Syu --noconfirm --needed archiso git &&
              git config --global --add safe.directory /devium &&
              [ -n "$EDITIONS" ] || { echo "No editions to build"; exit 1; }
              for ed in $EDITIONS; do
                echo "===== Building the $ed edition ====="
                EDITION=$ed OUT_DIR=/devium/out/$ed ./build.sh --clean || exit 1
              done'

      - name: Name the ISOs and add checksums
        run: |
          sudo chown -R "$USER" out
          mkdir -p out/release
          for ed in $EDITIONS; do
            iso="devium-${ed}-${DEVIUM_VERSION}-x86_64.iso"
            mv out/$ed/*.iso "out/release/$iso"
            (cd out/release && sha256sum "$iso" > "$iso.sha256")
            # GitHub Releases allow files up to 2 GiB (2147483648 bytes): only split ISOs bigger than that.
            if [[ -n $RELEASE && $(stat -c %s "out/release/$iso") -gt 2140000000 ]]; then
              (cd out/release && split -b 1900M -d -a 3 "$iso" "$iso." && rm "$iso")
            fi
          done
          ls -lh out/release
          notes="docs/releases/${RELEASE}.md"
          { [[ -f $notes ]] && cat "$notes"; echo; cat .github/release-footer.md; } > release-notes.md

      - name: Upload ISO (Actions download)
        if: env.RELEASE == ''
        uses: actions/upload-artifact@v4
        with:
          name: devium-iso
          path: out/release/*
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: env.RELEASE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE }}
          target_commitish: ${{ github.sha }}
          name: Devium ${{ env.DEVIUM_VERSION }}
          files: out/release/*
          body_path: release-notes.md
          prerelease: ${{ startsWith(env.RELEASE, 'beta') }}
