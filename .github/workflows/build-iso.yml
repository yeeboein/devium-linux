name: Build Devium ISO

# Run by hand (Actions tab -> Run workflow) to get a test ISO as a download,
# or push a tag like beta3 or v1.0 to publish a GitHub Release ("KDE Plasma" edition).
# Release notes come from docs/releases/<tag>.md when that file exists.
on:
  workflow_dispatch:
  push:
    tags: ['v*', 'beta*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EDITION: kdeplasma
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Pick the version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(date +%Y.%m.%d)"; fi
          echo "DEVIUM_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build ISO in an Arch Linux container
        run: |
          sudo docker run --rm --privileged \
            -e DEVIUM_VERSION -e DEVIUM_REF="${GITHUB_REF_NAME}" \
            -v "$PWD":/devium -w /devium \
            archlinux:latest \
            bash -c '
              printf "Server = %s\n" \
                "https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" \
                "https://mirrors.kernel.org/archlinux/\$repo/os/\$arch" \
                "https://mirror.rackspace.com/archlinux/\$repo/os/\$arch" \
                "https://mirror.leaseweb.net/archlinux/\$repo/os/\$arch" \
                "https://fastly.mirror.pkgbuild.com/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist &&
              pacman -Syu --noconfirm --needed archiso git &&
              git config --global --add safe.directory /devium &&
              ./build.sh'

      - name: Name the ISO and add a checksum
        run: |
          cd out
          sudo chown -R "$USER" .
          iso="devium-${EDITION}-${DEVIUM_VERSION}-x86_64.iso"
          mv ./*.iso "$iso"
          sha256sum "$iso" > "$iso.sha256"
          # GitHub Releases allow at most 2 GB per file: split bigger ISOs into parts.
          if [[ $GITHUB_REF == refs/tags/* && $(stat -c %s "$iso") -gt 2000000000 ]]; then
            split -b 1900M -d -a 3 "$iso" "$iso."
            rm "$iso"
            echo "SPLIT=1" >> "$GITHUB_ENV"
          fi
          ls -lh
          cd ..
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          { [[ -f $notes ]] && cat "$notes"; echo; cat .github/release-footer.md; } > release-notes.md

      - name: Upload ISO (Actions download)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: devium-iso
          path: out/*.iso*
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Devium KDE Plasma ${{ env.DEVIUM_VERSION }}
          files: out/*
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'beta') }}
