name: Boot test

# Boots the ISOs of a published release in a virtual machine and checks they reach the desktop.
# (The ISO build runs the same test on fresh ISOs; this one is for checking an existing release.)
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release to test (e.g. beta16)"
        required: true
      editions:
        description: "Editions (space separated)"
        required: false
        default: "kdeplasma xfce hyprland"

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up the virtual machine tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 libarchive-tools socat imagemagick
          # let this user use KVM (hardware speed-up)
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "No KVM: the test will be slow"
      - name: Download and boot each ISO
        env:
          RELEASE: ${{ github.event.inputs.release }}
          EDITIONS: ${{ github.event.inputs.editions }}
        run: |
          mkdir -p results && cd results
          fail=0
          for ed in $EDITIONS; do
            iso="devium-${ed}-${RELEASE#v}-x86_64.iso"
            echo "::group::$ed"
            curl -fsSL -o "$iso" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE}/${iso}" || { echo "Couldn't download $iso"; fail=1; echo "::endgroup::"; continue; }
            ../tools/boot-test.sh "$iso" || { echo "::error::$ed did not reach the desktop"; fail=1; }
            rm -f "$iso"
            echo "::endgroup::"
          done
          exit $fail
      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-${{ github.event.inputs.release }}
          path: results/*.boot.*
          retention-days: 14
